<title>Клинок лепестков</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Аниме-экшен от третьего лица: хранительница Мио защищает парящий храм от теней в масках.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Nunito:ital,wght@0,600;0,800;0,900;1,900&display=swap">
<style>
/*
  Арт-направление: аниме-закат, cel-shading с тёмной обводкой.
  Настроение: последний свет над парящим храмом, лепестки сакуры, тени в масках.
  Ключевые слова: сакура · закат · клинок.
  Раскладка: 3D-сцена на весь экран, HUD по углам, кнопки боя под правым большим пальцем.
  Тема одна, тёмная — осознанно: интерфейс лежит поверх яркой сцены.
*/
:root{
  color-scheme: dark;
  --ink:#1d1430;        /* обводка, тени интерфейса */
  --ink-2:#2e2150;      /* панели */
  --paper:#fff6fa;      /* светлый текст */
  --muted:#d4c6ea;      /* второстепенный текст */
  --sakura:#ff8fb8;     /* акцент */
  --sakura-deep:#e0457b;
  --sky:#7fd6ff;        /* энергия бури */
  --gold:#ffd36b;
  --hp:#ff5c8a;
  --danger:#ff4d5e;
  --font-display:'Dela Gothic One','Arial Black',Impact,system-ui,sans-serif;
  --font-ui:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gl:max(12px, env(safe-area-inset-left, 0px));
  --gr:max(12px, env(safe-area-inset-right, 0px));
  --gt:calc(env(safe-area-inset-top, 0px) + 10px);
  --gb:calc(env(safe-area-inset-bottom, 0px) + 14px);
}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--paper); font-family:var(--font-ui); font-weight:800;
  overflow:hidden; overscroll-behavior:none; touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
}
[hidden]{display:none!important}
button{font:inherit; color:inherit; cursor:pointer; touch-action:none}
button:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
#game{position:fixed; inset:0; overflow:hidden; background:#2a2f6e}
#cv3d,#fx{position:absolute; inset:0; width:100%; height:100%; display:block}
#fx{pointer-events:none}
#touch{position:absolute; inset:0}

/* ---------- HUD ---------- */
.hud{position:absolute; inset:0; pointer-events:none}
.stroke{-webkit-text-stroke:5px var(--ink); paint-order:stroke fill}
.hud-tl{position:absolute; top:var(--gt); left:var(--gl); display:flex; gap:10px; align-items:flex-start}
.portrait{width:58px; height:58px; border-radius:50%; border:3px solid var(--paper); box-shadow:0 0 0 3px var(--ink), 0 4px 0 3px var(--ink); background:var(--sakura); flex:none}
.bars{display:grid; gap:6px; width:min(44vw, 230px); padding-top:4px}
.bar{position:relative; height:16px; background:rgba(29,20,48,.78); border-radius:999px; box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--ink); overflow:hidden}
.bar i{position:absolute; inset:0 auto 0 0; border-radius:999px; background:linear-gradient(180deg,#ffc4d8 0 35%, var(--hp) 60%, #d23d6e); transition:width .15s ease-out}
.bar span{position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:11px; font-weight:900; letter-spacing:.04em; color:#fff; text-shadow:0 1px 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink)}
.bar.sp{height:10px}
.bar.sp i{background:linear-gradient(180deg,#e9fdff 0 35%, var(--sky) 60%, #3fa7d6)}
.bar.sp.full{animation:spglow .7s ease-in-out infinite alternate}
@keyframes spglow{to{box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--ink), 0 0 14px 4px rgba(127,214,255,.8)}}
.wave{display:inline-flex; align-items:center; gap:6px; margin-top:2px; padding:3px 10px; width:max-content; background:var(--ink); border-radius:999px; font-size:12px; letter-spacing:.06em; color:var(--paper)}
.wave b{color:var(--gold); font-weight:900}
.hud-tr{position:absolute; top:var(--gt); right:var(--gr); display:grid; justify-items:end; gap:6px}
.pause{pointer-events:auto; width:46px; height:46px; border-radius:50%; border:3px solid var(--paper); background:rgba(29,20,48,.7); box-shadow:0 0 0 3px var(--ink); display:grid; place-items:center}
.pause:active{transform:scale(.92)}
.pause svg{width:16px; height:16px}
.score{font-family:var(--font-display); font-size:24px; line-height:1; color:#fff; font-variant-numeric:tabular-nums; -webkit-text-stroke:0; text-shadow:2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink)}
.score small{display:block; margin-bottom:3px; font-family:var(--font-ui); font-size:10px; letter-spacing:.14em; color:var(--paper); text-align:right; text-shadow:0 0 3px var(--ink), 0 0 2px var(--ink)}
.bossbar{position:absolute; top:calc(var(--gt) + 82px); left:var(--gl); right:var(--gr); max-width:520px; margin:0 auto; display:grid; gap:5px}
.bossbar span{font-family:var(--font-display); font-size:15px; letter-spacing:.06em; color:var(--gold); text-align:center}
.bossbar .bar{height:14px}
.bossbar .bar i{background:linear-gradient(180deg,#ffb27a 0 35%, #ff5a3d 60%, #b8242c)}
.combo{position:absolute; right:var(--gr); top:34%; text-align:right; transform-origin:right center}
.combo b{display:block; font-family:var(--font-display); font-weight:400; font-size:56px; line-height:.9; font-style:italic; color:var(--gold); font-variant-numeric:tabular-nums}
.combo span{font-weight:900; font-size:14px; letter-spacing:.2em; font-style:italic; color:#fff}
.combo.pop{animation:pop .18s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(1.35) rotate(-4deg)}}
.keys-hint{position:absolute; left:var(--gl); bottom:var(--gb); font-size:12px; color:var(--paper); background:rgba(29,20,48,.6); padding:6px 10px; border-radius:10px; max-width:calc(100% - 32px)}
.keys-hint b{color:var(--gold)}

/* ---------- Сенсорное управление ---------- */
.stick{position:absolute; width:124px; height:124px; margin:-62px 0 0 -62px; border-radius:50%; border:3px solid rgba(255,246,250,.75); background:radial-gradient(circle, rgba(255,143,184,.18), rgba(29,20,48,.35)); pointer-events:none}
.stick i{position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff, #ffc2d8 45%, #ff7aa8); box-shadow:0 0 0 3px var(--ink)}
.stick-hint{position:absolute; left:calc(var(--gl) + 24px); bottom:calc(var(--gb) + 30px); width:110px; height:110px; border-radius:50%; border:3px dashed rgba(255,246,250,.75); background:rgba(29,20,48,.4); display:grid; place-items:center; text-align:center; font-size:11px; color:#fff; line-height:1.25; pointer-events:none}
.pad{position:absolute; right:var(--gr); bottom:var(--gb); width:232px; height:214px; pointer-events:none}
.pad button{position:absolute; pointer-events:auto; border-radius:50%; border:3px solid var(--paper); box-shadow:0 0 0 3px var(--ink), 0 5px 0 3px var(--ink); background:rgba(46,33,80,.72); color:#fff; display:grid; place-items:center; align-content:center; gap:1px; padding:0}
.pad button svg{width:42%; height:42%}
.pad button em{font-style:normal; font-size:9px; letter-spacing:.08em; font-weight:900}
.pad button.on,.pad button:active{transform:translateY(3px); box-shadow:0 0 0 3px var(--ink), 0 2px 0 3px var(--ink)}
.b-attack{width:96px; height:96px; right:0; bottom:0; background:radial-gradient(circle at 35% 28%, #ffd6e5, #ff7aa8 55%, #d94379)!important; color:var(--ink)!important}
.b-dash{width:66px; height:66px; right:110px; bottom:2px}
.b-jump{width:66px; height:66px; right:16px; bottom:112px}
.b-special{width:74px; height:74px; right:100px; bottom:92px; background:conic-gradient(var(--sky) calc(var(--p, 0) * 1turn), rgba(46,33,80,.72) 0)!important}
.b-special::before{content:""; position:absolute; inset:7px; border-radius:50%; background:rgba(46,33,80,.92)}
.b-special > *{position:relative}
.b-special.ready{animation:ready .6s ease-in-out infinite alternate}
.b-special.ready::before{background:radial-gradient(circle at 35% 30%, #f2feff, #7fd6ff 60%, #3a8fd0)}
.b-special.ready{color:var(--ink)}
@keyframes ready{to{box-shadow:0 0 0 3px var(--ink), 0 5px 0 3px var(--ink), 0 0 22px 6px rgba(127,214,255,.85)}}
.b-dash::after{content:""; position:absolute; inset:0; border-radius:50%; background:conic-gradient(rgba(29,20,48,.7) calc(var(--cd, 0) * 1turn), transparent 0)}

/* ---------- Баннер ---------- */
.banner{position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none; opacity:0}
.banner b{display:block; font-family:var(--font-display); font-weight:400; font-size:clamp(40px, 12vw, 84px); line-height:1; color:#fff; letter-spacing:.02em; -webkit-text-stroke:8px var(--ink); paint-order:stroke fill; text-shadow:0 6px 0 var(--sakura-deep)}
.banner span{display:inline-block; margin-top:10px; padding:5px 14px; border-radius:999px; background:var(--ink); color:var(--gold); font-size:15px; letter-spacing:.1em}
.banner.show{animation:banner 2.1s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes banner{0%{opacity:0; transform:scale(1.6) skewX(-8deg)} 12%{opacity:1; transform:scale(1) skewX(-8deg)} 80%{opacity:1; transform:scale(1) skewX(-8deg)} 100%{opacity:0; transform:scale(.96) skewX(-8deg)}}

/* ---------- Оверлеи ---------- */
.overlay{position:absolute; inset:0; z-index:10; display:grid; place-items:center; overflow:auto;
  padding-top:max(16px, env(safe-area-inset-top, 0px)); padding-bottom:max(16px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:rgba(29,20,48,.55); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
.panel{width:100%; max-width:440px; max-height:100%; overflow:auto; display:grid; gap:14px; padding:22px 20px;
  background:linear-gradient(180deg, rgba(46,33,80,.96), rgba(29,20,48,.96)); border-radius:22px;
  box-shadow:0 0 0 3px var(--paper), 0 0 0 6px var(--ink), 0 14px 40px rgba(0,0,0,.45); animation:rise .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{opacity:0; transform:translateY(16px) scale(.96)}}
.panel h2{margin:0; font-family:var(--font-display); font-weight:400; font-size:28px; line-height:1.1; color:#fff; text-wrap:balance}
.panel p{margin:0; line-height:1.5; font-weight:600; color:var(--muted)}
.eyebrow{font-size:12px!important; letter-spacing:.18em; text-transform:uppercase; color:var(--sakura)!important; font-weight:900!important}
.btn{min-height:52px; padding:0 20px; border-radius:16px; border:0; background:var(--ink-2); color:#fff; font-family:var(--font-display); font-size:17px; letter-spacing:.04em; box-shadow:0 0 0 3px var(--paper), 0 5px 0 3px var(--ink)}
.btn:active{transform:translateY(3px); box-shadow:0 0 0 3px var(--paper), 0 2px 0 3px var(--ink)}
.btn.primary{background:linear-gradient(180deg,#ffc2d8,#ff7aa8 60%,#e0457b); color:var(--ink)}
.btn.ghost{background:transparent}
.btns{display:grid; gap:12px}
.row{display:flex; gap:12px; flex-wrap:wrap}
.row .btn{flex:1 1 140px}

.overlay.title{background:linear-gradient(180deg, rgba(29,20,48,.55) 0, rgba(29,20,48,0) 34%, rgba(29,20,48,0) 50%, rgba(29,20,48,.82) 78%); -webkit-backdrop-filter:none; backdrop-filter:none; grid-template-columns:minmax(0,1fr); place-items:stretch}
.title-wrap{display:flex; flex-direction:column; justify-content:space-between; gap:18px; max-width:480px; width:100%; min-width:0; margin:0 auto; min-height:100%}
.jp{margin:0; font-family:var(--font-display); font-size:16px; letter-spacing:.3em; color:var(--paper); opacity:.9}
.logo{margin:4px 0 0; font-family:var(--font-display); font-weight:400; font-size:clamp(34px, 10.4vw, 72px); line-height:.98; color:#fff; -webkit-text-stroke:9px var(--ink); paint-order:stroke fill; text-shadow:0 7px 0 var(--sakura-deep); transform:skewX(-7deg); transform-origin:left}
.logo em{font-style:normal; color:var(--sakura)}
.tag{margin:12px 0 0; display:inline-block; padding:5px 12px; border-radius:999px; background:var(--ink); font-size:13px; letter-spacing:.08em; color:var(--gold)}
.lede{margin:0 0 4px; font-size:15px; line-height:1.5; font-weight:700; color:var(--paper); max-width:40ch; text-shadow:0 1px 3px rgba(0,0,0,.6)}
.record{margin:0; font-size:13px; color:var(--muted); text-align:center}
.cards{display:grid; gap:10px}
.card{display:grid; grid-template-columns:48px minmax(0,1fr); gap:12px; align-items:center; text-align:left; padding:12px 14px; border-radius:16px; border:0; background:rgba(255,246,250,.06); box-shadow:0 0 0 2px rgba(255,143,184,.55)}
.card:hover,.card:focus-visible{box-shadow:0 0 0 3px var(--sakura); background:rgba(255,143,184,.12)}
.card:active{transform:scale(.98)}
.card svg{width:48px; height:48px}
.card b{display:block; font-family:var(--font-display); font-weight:400; font-size:17px; color:#fff}
.card span{display:block; margin-top:2px; font-size:13px; line-height:1.4; font-weight:700; color:var(--muted)}
.card i{display:block; margin-top:5px; font-style:normal; font-size:11px; letter-spacing:.1em; color:var(--sakura)}
.sheet{margin:0; display:grid; grid-template-columns:1fr auto; border-radius:14px; overflow:hidden; background:rgba(255,246,250,.05)}
.sheet dt,.sheet dd{margin:0; padding:9px 14px; border-bottom:1px solid rgba(255,246,250,.08); font-size:14px}
.sheet dt{color:var(--muted); font-weight:700}
.sheet dd{text-align:right; font-weight:900; font-variant-numeric:tabular-nums}
.sheet dt:nth-last-child(2),.sheet dd:last-child{border-bottom:0}
.sheet dd.total{color:var(--gold); font-family:var(--font-display); font-weight:400; font-size:18px}
.newrec{color:var(--gold)!important; font-family:var(--font-display); font-weight:400!important; text-align:center}
.toggles{display:grid; gap:8px}
.toggle{display:flex; justify-content:space-between; align-items:center; min-height:50px; padding:0 16px; border-radius:14px; border:0; background:rgba(255,246,250,.06); font-weight:800; text-align:left}
.toggle i{font-style:normal; font-size:12px; padding:4px 10px; border-radius:999px; background:var(--ink); color:var(--muted); letter-spacing:.08em}
.toggle[aria-pressed="true"] i{background:var(--sakura); color:var(--ink)}
.rules{margin:0; padding:0; list-style:none; display:grid; gap:10px}
.rules li{display:grid; grid-template-columns:30px minmax(0,1fr); gap:10px; font-size:14px; line-height:1.45; font-weight:700; color:var(--paper)}
.rules li b{color:var(--sakura)}
.rules svg{width:28px; height:28px}
.err{max-width:420px; text-align:center}
@media (prefers-reduced-motion: reduce){
  .banner.show{animation-duration:1.4s}
  .panel,.combo.pop{animation:none}
}
</style>

<div id="game">
  <canvas id="cv3d" aria-label="Игровая сцена"></canvas>
  <canvas id="fx"></canvas>
  <div id="touch"></div>

  <div class="hud" id="hud" hidden>
    <div class="hud-tl">
      <canvas class="portrait" id="portrait" width="116" height="116" aria-hidden="true"></canvas>
      <div class="bars">
        <div class="bar" aria-label="Здоровье"><i id="hpFill" style="width:100%"></i><span id="hpText">100</span></div>
        <div class="bar sp" id="spBar" aria-label="Буря лепестков"><i id="spFill" style="width:0%"></i></div>
        <div class="wave stroke-none">ВОЛНА <b id="waveN">1/10</b> · <span id="leftN">врагов 0</span></div>
      </div>
    </div>
    <div class="hud-tr">
      <button class="pause" id="pauseBtn" aria-label="Пауза">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="3.6" height="12" rx="1"/><rect x="9.4" y="2" width="3.6" height="12" rx="1"/></svg>
      </button>
      <div class="score"><small>ОЧКИ</small><span id="score">0</span></div>
    </div>
    <div class="bossbar" id="bossbar" hidden><span class="stroke" id="bossName">Великий Они</span><div class="bar"><i id="bossFill" style="width:100%"></i></div></div>
    <div class="combo" id="combo" hidden><b class="stroke" id="comboN">0</b><span class="stroke">КОМБО</span></div>

    <div class="pad touch-only" id="pad">
      <button class="b-special" id="bSpecial" aria-label="Буря лепестков">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1.6 2 2 4 1.2 6 2-1.3 4.2-1.4 6.3-.3-1 2.3-2.8 3.4-5 3.6 2.2.8 3.5 2.5 3.8 5-2.4.5-4.4-.3-5.8-2 .3 2.3-.5 4.3-2.4 5.7-1.6-2-1.9-4.2-1-6.3-1.8 1.4-4 1.8-6.3 1.1.7-2.4 2.3-3.8 4.6-4.3-2.3-.6-3.8-2.2-4.3-4.6 2.4-.7 4.5-.2 6.2 1.3C8.5 6 9.6 3.6 12 2z"/></svg>
        <em>БУРЯ</em>
      </button>
      <button class="b-jump" id="bJump" aria-label="Прыжок">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l7-7 7 7M5 20l7-7 7 7"/></svg>

        <em>РЫВОК</em>

  <div class="banner" id="banner"><b id="bannerT">ВОЛНА 1</b><span id="bannerS">Закат начинается</span></div>
  <div class="overlay" id="overlay" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   КЛИНОК ЛЕПЕСТКОВ — аниме-экшен от третьего лица.
   Всё процедурное: модели собраны из примитивов, лица нарисованы на canvas,
   свет — toon-шейдинг с обводкой, звук и музыка — синтез Web Audio.
   Внешняя зависимость одна: three.js r128 (cdnjs).
   ===================================================================== */
if (typeof THREE === 'undefined'){
  const ov = document.getElementById('overlay'), pn = document.getElementById('panel');
  ov.hidden = false;
  pn.innerHTML = '<div class="err"><h2>Не загрузился 3D-движок</h2><p>Игре нужна библиотека three.js с cdnjs.cloudflare.com. Проверь подключение к интернету и обнови страницу.</p></div>';
  throw new Error('three.js не загружен');
}

// ============================== CONFIG ==============================
const CONFIG = {
  ARENA_R: 17.5, WAVES: 10, MAX_ALIVE: 8,
  PLAYER: { hp: 100, speed: 6.4, accel: 40, airAccel: 18, jump: 8.8, gravity: 25, radius: 0.42,
            dashSpeed: 21, dashTime: 0.2, dashCd: 0.7, dashIframes: 0.3, hurtIframes: 0.75 },
  COMBO: [
    { dmg: 14, range: 2.6, arc: 2.4, dur: 0.30, hitAt: 0.11, lunge: 4.2, knock: 4,  kind: 'r2l' },
    { dmg: 16, range: 2.6, arc: 2.4, dur: 0.30, hitAt: 0.11, lunge: 4.2, knock: 4,  kind: 'l2r' },
    { dmg: 30, range: 3.0, arc: 7.0, dur: 0.50, hitAt: 0.20, lunge: 5.5, knock: 11, kind: 'spin' },
  ],

function toon(color, o = {}){

  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({ color, gradientMap: o.grad2 ? GRAD2 : GRAD3, side: o.side || THREE.FrontSide, vertexColors: !!o.vc });
  if (o.emissive){ m.emissive.setHex(o.emissive); m.emissiveIntensity = o.ei ?? 1; }

}
// Обводка: «вывернутая оболочка», вершины сдвинуты по нормали
const outlineMats = new Map();
function outlineMat(t){
  const k = t.toFixed(4);
  if (outlineMats.has(k)) return outlineMats.get(k);
  const m = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { thick: { value: t }, ocolor: { value: new THREE.Color(C.outline) } }]),
    vertexShader: [
      'uniform float thick;',
      '#include <fog_pars_vertex>',
      'void main(){',
      '  vec3 p = position + normalize(normal) * thick;',
      '  vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);',
      '  gl_Position = projectionMatrix * mvPosition;',
      '  #include <fog_vertex>',
      '}'].join('\n'),
    fragmentShader: [
      'uniform vec3 ocolor;',
      '#include <fog_pars_fragment>',
      'void main(){',
      '  gl_FragColor = vec4(ocolor, 1.0);',
      '  #include <fog_fragment>',
      '}'].join('\n'),
    side: THREE.BackSide, fog: true,
  });
  outlineMats.set(k, m); return m;
}
const outlineBasic = new THREE.MeshBasicMaterial({ color: C.outline, side: THREE.BackSide });
function addOutline(mesh, t = 0.025, smoothGeo){
  const geo = smoothGeo || mesh.geometry;

  else {
    geo.computeBoundingSphere();
    o = new THREE.Mesh(geo, outlineBasic);
    o.scale.setScalar(1 + t / Math.max(0.04, geo.boundingSphere.radius));

}

function ellipsoid(parent, rx, ry, rz, mat, x, y, z, ot = 0.016){
  const m = mesh(UNIT_SPHERE, mat, parent, x, y, z); m.scale.set(rx, ry, rz);

// свои копии материалов — чтобы вспышка попадания была у каждого своя
function ownMaterials(root){
  const list = [], seen = new Map();
  root.traverse(o => {
    if (!o.isMesh || o.userData.isOutline || !o.material || !o.material.isMeshToonMaterial) return;
    if (!seen.has(o.material)){ const c = o.material.clone(); c.userData.baseEmissive = c.emissive.getHex(); c.userData.baseEI = c.emissiveIntensity; seen.set(o.material, c); list.push(c); }
    o.material = seen.get(o.material);
  });
  return list;
}

class PSystem {
  constructor(max, tex, additive){
    this.max = max; this.i = 0;
    this.pos = new Float32Array(max * 3); this.col = new Float32Array(max * 3); this.size = new Float32Array(max); this.alpha = new Float32Array(max);
    this.vel = new Float32Array(max * 3); this.life = new Float32Array(max); this.age = new Float32Array(max);
    this.grav = new Float32Array(max); this.drag = new Float32Array(max); this.s0 = new Float32Array(max); this.grow = new Float32Array(max); this.a0 = new Float32Array(max); this.sway = new Float32Array(max);
    const g = new THREE.BufferGeometry();
    const at = (arr, n) => { const a = new THREE.BufferAttribute(arr, n); a.setUsage(THREE.DynamicDrawUsage); return a; };
    g.setAttribute('position', at(this.pos, 3)); g.setAttribute('pcolor', at(this.col, 3)); g.setAttribute('psize', at(this.size, 1)); g.setAttribute('palpha', at(this.alpha, 1));
    this.mat = new THREE.ShaderMaterial({
      uniforms: { map: { value: tex }, scale: { value: 500 } },
      vertexShader: [
        'attribute vec3 pcolor; attribute float psize; attribute float palpha;',
        'uniform float scale; varying vec3 vColor; varying float vAlpha;',
        'void main(){ vColor = pcolor; vAlpha = palpha; vec4 mv = modelViewMatrix * vec4(position, 1.0);',
        '  gl_PointSize = psize * scale / max(0.1, -mv.z); gl_Position = projectionMatrix * mv; }'].join('\n'),
      fragmentShader: [
        'uniform sampler2D map; varying vec3 vColor; varying float vAlpha;',
        'void main(){ vec4 t = texture2D(map, gl_PointCoord); float a = t.a * vAlpha; if (a < 0.01) discard; gl_FragColor = vec4(vColor * t.rgb, a); }'].join('\n'),
      transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    });
    this.points = new THREE.Points(g, this.mat); this.points.frustumCulled = false; this.points.renderOrder = 5;
    scene.add(this.points); this.geo = g;
  }
  spawn(x, y, z, o = {}){
    const i = this.i; this.i = (this.i + 1) % this.max;
    this.pos[i * 3] = x; this.pos[i * 3 + 1] = y; this.pos[i * 3 + 2] = z;
    this.vel[i * 3] = o.vx || 0; this.vel[i * 3 + 1] = o.vy || 0; this.vel[i * 3 + 2] = o.vz || 0;
    const c = o.color || [1, 1, 1]; this.col[i * 3] = c[0]; this.col[i * 3 + 1] = c[1]; this.col[i * 3 + 2] = c[2];
    this.life[i] = o.life || 0.6; this.age[i] = 0; this.grav[i] = o.grav ?? 0; this.drag[i] = o.drag ?? 1;
    this.s0[i] = o.size || 0.3; this.grow[i] = o.grow ?? 0; this.a0[i] = o.alpha ?? 1; this.sway[i] = o.sway || 0;
    this.size[i] = this.s0[i]; this.alpha[i] = this.a0[i];
  }
  update(dt){
    for (let i = 0; i < this.max; i++){
      if (this.life[i] <= 0) continue;
      this.age[i] += dt;
      if (this.age[i] >= this.life[i]){ this.life[i] = 0; this.alpha[i] = 0; this.size[i] = 0; continue; }
      const k = this.age[i] / this.life[i], j = i * 3;
      this.vel[j + 1] -= this.grav[i] * dt;
      const d = Math.exp(-this.drag[i] * dt);
      this.vel[j] *= d; this.vel[j + 1] *= d; this.vel[j + 2] *= d;
      this.pos[j] += (this.vel[j] + Math.sin(this.age[i] * 3 + i) * this.sway[i]) * dt;
      this.pos[j + 1] += this.vel[j + 1] * dt;
      this.pos[j + 2] += (this.vel[j + 2] + Math.cos(this.age[i] * 2.6 + i) * this.sway[i]) * dt;
      this.alpha[i] = this.a0[i] * (1 - k * k);
      this.size[i] = this.s0[i] * (1 + this.grow[i] * k);
    }
    const a = this.geo.attributes;
    a.position.needsUpdate = true; a.pcolor.needsUpdate = true; a.psize.needsUpdate = true; a.palpha.needsUpdate = true;
  }
}

const COL = { pink: [1, 0.55, 0.75], white: [1, 1, 1], cyan: [0.5, 0.9, 1], gold: [1, 0.85, 0.4], purple: [0.6, 0.35, 1], dark: [0.25, 0.15, 0.4], orange: [1, 0.6, 0.25], red: [1, 0.3, 0.35], dust: [0.85, 0.78, 0.82] };

function arcGeometry(span, rIn, rOut, seg = 30){

    const u = i / seg, a = -span / 2 + span * u, s = Math.sin(a), c = Math.cos(a);

}

  'void main(){',
  '  float a = smoothstep(prog - 0.65, prog, vUv.x) * (1.0 - smoothstep(prog, prog + 0.03, vUv.x));',
  '  float edge = pow(vUv.y, 2.0) * (1.0 - smoothstep(0.9, 1.0, vUv.y));',
  '  vec3 c = mix(colIn, colOut, smoothstep(0.55, 0.95, vUv.y));',

}

const Snd = {
  ctx: null, out: null, sfxBus: null, musBus: null, nbuf: null,
  init(){
    if (this.ctx){ if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      this.ctx = new AC();
      this.out = this.ctx.createDynamicsCompressor(); this.out.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = 0.6; this.sfxBus.connect(this.out);
      this.musBus = this.ctx.createGain(); this.musBus.gain.value = settings.music ? 0.32 : 0; this.musBus.connect(this.out);
      const len = this.ctx.sampleRate; this.nbuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const ch = this.nbuf.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      Music.start();
    } catch { this.ctx = null; }
  },
  env(node, vol, dur, delay, bus){
    const g = this.ctx.createGain(), t = this.ctx.currentTime + delay;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(bus || this.sfxBus); return t;
  },
  tone(f, dur, type = 'sine', vol = 0.15, f2 = 0, delay = 0, bus){
    if (!this.ctx || (!bus && !settings.sound)) return;
    const o = this.ctx.createOscillator(); o.type = type; const t = this.env(o, vol, dur, delay, bus);
    o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol = 0.2, freq = 1000, delay = 0, type = 'lowpass', f2 = 0, q = 1, bus){
    if (!this.ctx || (!bus && !settings.sound)) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.nbuf;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    const t = this.env(f, vol, dur, delay, bus);
    f.frequency.setValueAtTime(freq, t); if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    s.connect(f); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
};
function sfx(n){

    case 'swing': s.noise(0.16, 0.22, 4200 * v, 0, 'bandpass', 900, 1.4); break;
    case 'swing3': s.noise(0.3, 0.28, 5000 * v, 0, 'bandpass', 600, 1.2); s.tone(900, 0.2, 'sine', 0.05, 300); break;
    case 'hit': s.noise(0.1, 0.35, 2500, 0, 'lowpass', 600); s.tone(160 * v, 0.12, 'triangle', 0.25, 60); break;
    case 'crit': s.noise(0.12, 0.4, 3500); s.tone(1500, 0.18, 'square', 0.06, 700); s.tone(160, 0.14, 'triangle', 0.25, 50); break;
    case 'dash': s.noise(0.22, 0.2, 1800, 0, 'bandpass', 5000, 0.8); break;
    case 'jump': s.tone(380 * v, 0.14, 'sine', 0.1, 760); break;
    case 'land': s.noise(0.08, 0.12, 400); break;

    case 'kill': s.noise(0.25, 0.25, 900, 0, 'lowpass', 200); [880, 1320].forEach((f, i) => s.tone(f * v, 0.18, 'triangle', 0.07, 0, 0.04 + i * 0.05)); break;
    case 'special': s.noise(0.9, 0.3, 600, 0, 'bandpass', 6000, 0.7); [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => s.tone(f, 0.35, 'triangle', 0.08, 0, i * 0.05)); break;
    case 'boom': s.noise(0.6, 0.6, 500, 0, 'lowpass', 60); s.tone(90, 0.5, 'sine', 0.45, 30); break;
    case 'shoot': s.tone(700 * v, 0.2, 'sine', 0.08, 250); break;
    case 'cut': s.tone(2200, 0.12, 'triangle', 0.08, 1400); break;
    case 'heal': [660, 880, 1100].forEach((f, i) => s.tone(f, 0.16, 'sine', 0.09, 0, i * 0.06)); break;
    case 'portal': s.tone(120, 0.6, 'sawtooth', 0.04, 260); s.noise(0.5, 0.06, 900, 0, 'bandpass', 300); break;
    case 'roar': s.tone(110, 1.1, 'sawtooth', 0.22, 55); s.tone(82, 1.1, 'square', 0.12, 41); s.noise(1.0, 0.25, 500, 0, 'lowpass', 120); break;
    case 'windup': s.tone(220, 0.4, 'triangle', 0.06, 440); break;
    case 'clear': [523, 659, 784, 1046].forEach((f, i) => s.tone(f, 0.3, 'triangle', 0.12, 0, i * 0.09)); break;
    case 'ui': s.tone(1200, 0.05, 'sine', 0.06); break;
    case 'pick': s.tone(980, 0.08, 'triangle', 0.08); s.tone(1470, 0.12, 'triangle', 0.08, 0, 0.06); break;

}
// Музыка: пентатоника «ин» (D Eb G A Bb), кото-подобные щипки, мягкий пэд и тайко
const Music = {
  on: false, next: 0, step: 0, deg: 7, timer: null, pad: null,
  scale: [0, 1, 5, 7, 8], root: 62,
  midi(d){ const o = Math.floor(d / 5), i = ((d % 5) + 5) % 5; return this.root + o * 12 + this.scale[i]; },
  hz(m){ return 440 * Math.pow(2, (m - 69) / 12); },
  start(){
    if (!Snd.ctx || this.on) return;
    this.on = true; this.next = Snd.ctx.currentTime + 0.15;
    this.timer = setInterval(() => this.schedule(), 60);
    const c = Snd.ctx, g = c.createGain(); g.gain.value = 0.05; const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    lp.connect(g); g.connect(Snd.musBus);
    const oscs = [this.hz(38), this.hz(45), this.hz(50)].map((f, i) => { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = (i - 1) * 7; o.connect(lp); o.start(); return o; });
    this.pad = { g, oscs };
  },
  pluck(m, t, vol = 0.14){
    const c = Snd.ctx, f = this.hz(m);
    const o = c.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(f * 1.01, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.05);
    const o2 = c.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = f * 2;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(500, t + 0.6);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
    const g2 = c.createGain(); g2.gain.value = 0.18;
    o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(Snd.musBus);
    o.start(t); o2.start(t); o.stop(t + 1.3); o2.stop(t + 1.3);
  },
  taiko(t, vol){
    const c = Snd.ctx, o = c.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.25);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g); g.connect(Snd.musBus); o.start(t); o.stop(t + 0.5);
  },
  schedule(){
    const c = Snd.ctx; if (!c) return;
    const intense = game.boss ? 2 : (game.state === 'play' || game.state === 'intro') ? 1 : 0;
    const bpm = intense === 2 ? 132 : intense === 1 ? 104 : 84, stepT = 60 / bpm / 2;
    while (this.next < c.currentTime + 0.25){
      const t = this.next, b = this.step % 16;
      if (b === 0) this.taiko(t, 0.5);
      if (intense && (b === 8 || b === 11)) this.taiko(t, 0.32);
      if (intense === 2 && b % 4 === 2) this.taiko(t, 0.22);
      if (b % 2 === 0 || Math.random() < (intense ? 0.35 : 0.15)){
        this.deg = clamp(this.deg + [-2, -1, -1, 1, 1, 2, 0][Math.floor(Math.random() * 7)], 2, 13);
        if (Math.random() < 0.85) this.pluck(this.midi(this.deg), t, b % 4 === 0 ? 0.13 : 0.09);
      }
      if (b === 0 || b === 8) this.pluck(this.midi(intense === 2 ? -3 : -5 + (b === 8 ? 3 : 0)), t, 0.12);
      this.next += stepT; this.step++;
    }
  },
  setOn(on){ if (Snd.musBus) Snd.musBus.gain.setTargetAtTime(on ? 0.32 : 0, Snd.ctx.currentTime, 0.3); },
};

// ============================== ИГРОК ==============================
function fwdVec(a){ return new V3(Math.sin(a), 0, Math.cos(a)); }
function getMoveInput(){
  let x = 0, y = 0;
  if (input.stick.id !== null){ x = input.stick.x; y = input.stick.y; }
  else {
    const k = input.keys;
    if (k.has('KeyW') || k.has('ArrowUp')) y += 1; if (k.has('KeyS') || k.has('ArrowDown')) y -= 1;
    if (k.has('KeyD') || k.has('ArrowRight')) x += 1; if (k.has('KeyA') || k.has('ArrowLeft')) x -= 1;
    const l = Math.hypot(x, y); if (l > 1){ x /= l; y /= l; }
  }
  const fwd = new V3(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw)), right = new V3(Math.cos(cam.yaw), 0, -Math.sin(cam.yaw));
  return right.multiplyScalar(x).addScaledVector(fwd, y);
}
function canControl(){ return (game.state === 'play' || game.state === 'intro' || game.state === 'clear') && player.state !== 'dead'; }
function nearestFoe(maxD, dirPref){
  let best = null, bs = 1e9;
  for (const f of foes){
    if (!f.alive || f.spawnT > 0) continue;
    const dx = f.pos.x - player.pos.x, dz = f.pos.z - player.pos.z, d = Math.hypot(dx, dz) - f.r;
    if (d > maxD) continue;
    let s = d;
    if (dirPref){ const a = Math.atan2(dx, dz); s += Math.abs(angleDiff(dirPref, a)) * 1.6; }
    if (s < bs){ bs = s; best = f; }
  }
  return best;
}
function startAttack(i){
  const c = CONFIG.COMBO[i];
  player.state = 'attack'; player.combo = i; player.t = 0; player.hitDone = false; player.queued = false;
  const mv = getMoveInput();
  const pref = mv.lengthSq() > 0.04 ? Math.atan2(mv.x, mv.z) : player.facing;
  const tgt = nearestFoe(5.5, pref);
  let dist = 99;
  if (tgt){ player.facing = Math.atan2(tgt.pos.x - player.pos.x, tgt.pos.z - player.pos.z); dist = Math.hypot(tgt.pos.x - player.pos.x, tgt.pos.z - player.pos.z) - tgt.r; }
  else player.facing = pref;
  const f = fwdVec(player.facing), lunge = c.lunge * clamp((dist - 0.6) / 2, 0.15, 1);
  player.vel.x = f.x * lunge; player.vel.z = f.z * lunge;
  if (i === 2 && player.onGround) player.vy = 3.2;
  spawnSlash(c.kind);
  sfx(i === 2 ? 'swing3' : 'swing');
  hero.bladeGlow.material.opacity = 0.7;
}
function pressAttack(){
  if (!canControl()) return;
  if (player.state === 'attack'){ if (player.t > CONFIG.COMBO[player.combo].dur * 0.25) player.queued = true; return; }
  if (player.state !== 'move') return;
  if (player.comboWin > 0 && player.lastCombo < 2) startAttack(player.lastCombo + 1);
  else startAttack(0);
}
function doHit(){
  player.hitDone = true;
  const c = CONFIG.COMBO[player.combo], range = c.range * S.rangeMul, fw = player.facing;
  let hits = 0;
  const air = player.pos.y > 0.4 ? S.airMul : 1;
  for (const f of foes){
    if (!f.alive || f.spawnT > 0) continue;
    const dx = f.pos.x - player.pos.x, dz = f.pos.z - player.pos.z, d = Math.hypot(dx, dz) - f.r;
    if (d > range) continue;
    if (Math.abs((f.pos.y + (f.kind === 'lantern' ? 1.45 : 0.5)) - (player.pos.y + 0.9)) > 2.6) continue;
    if (c.arc < 6.3 && d > 0.5 && Math.abs(angleDiff(fw, Math.atan2(dx, dz))) > c.arc / 2) continue;
    const crit = Math.random() < S.crit;
    const dmg = c.dmg * S.dmgMul * air * rand(0.92, 1.08) * (crit ? 1.8 : 1);
    const kd = new V3(dx, 0, dz).normalize();
    damageFoe(f, dmg, crit, kd, c.knock);
    hits++;
  }
  for (const o of orbs){
    if (o.dead) continue;
    const dx = o.mesh.position.x - player.pos.x, dz = o.mesh.position.z - player.pos.z, d = Math.hypot(dx, dz);
    if (d < range + 0.4 && (c.arc >= 6.3 || Math.abs(angleDiff(fw, Math.atan2(dx, dz))) < c.arc / 2 + 0.3)){
      o.dead = true; burst(o.mesh.position.x, o.mesh.position.y, o.mesh.position.z, 10, { speed: 5, life: 0.4, size: 0.35, colors: [COL.white, COL.cyan] });
      addScore(20); sfx('cut'); addNumber(o.mesh.position, 'СРЕЗ!', 'cut');
    }
  }
  if (hits){
    hitStop(0.04 + Math.min(0.05, hits * 0.012) + (player.combo === 2 ? 0.03 : 0));
    shake(player.combo === 2 ? 0.28 : 0.14, 0.15);
    gainSp(CONFIG.SPECIAL.gainHit * hits);
  }
  if (player.combo === 2 && S.waveLvl > 0) fireBladeWave();
}
function fireBladeWave(){
  const key = 'wave';
  if (!ARC_GEO[key]) ARC_GEO[key] = arcGeometry(Math.PI * 0.8, 0.2, 1.4, 24);
  const m = new THREE.Mesh(ARC_GEO[key], slashMaterial(0x9fe8ff, 0xffffff)); m.material.userData.disposable = true;
  m.material.uniforms.prog.value = 1.05;
  const g = new THREE.Group(); g.add(m); g.rotation.y = player.facing;
  g.position.set(player.pos.x, player.pos.y + 0.8, player.pos.z); scene.add(g);
  bladeWaves.push({ g, m, dir: fwdVec(player.facing), t: 0, hit: new Set(), dmg: 16 + 10 * S.waveLvl });
}
function updateBladeWaves(dt){
  for (let i = bladeWaves.length - 1; i >= 0; i--){
    const w = bladeWaves[i]; w.t += dt;
    w.g.position.addScaledVector(w.dir, 17 * dt);
    w.m.material.uniforms.fade.value = 1 - w.t / 0.6;
    for (const f of foes){
      if (!f.alive || f.spawnT > 0 || w.hit.has(f)) continue;
      if (Math.hypot(f.pos.x - w.g.position.x, f.pos.z - w.g.position.z) < f.r + 1.0){ w.hit.add(f); damageFoe(f, w.dmg * S.dmgMul, false, w.dir.clone(), 4); }
    }
    if (w.t > 0.6){ scene.remove(w.g); w.m.material.dispose(); bladeWaves.splice(i, 1); }
  }
}
function pressDash(){
  if (!canControl() || player.dashCd > 0 || player.state === 'special' || player.state === 'hurt') return;

function specialPulse(){
  const R = CONFIG.SPECIAL.radius;

const ONI_PATTERN = ['slam', 'charge', 'volley', 'slam', 'charge', 'summon'];
function updateOni(f, dt, dist, nx, nz){
  const pp = player.pos, pAlive = player.state !== 'dead';
  f.wx = 0; f.wz = 0; f.direct = false;
  if (!f.phase2 && f.hp < f.maxHp * 0.5){ f.phase2 = true; banner('ЯРОСТЬ ОНИ', 'Он стал быстрее'); sfx('roar'); shake(0.6, 0.6); }

  const A = f.arms[0], L = f.arms[1];
  const walkAnim = (amt) => { const w = Math.sin(f.ph * 3.2) * amt; f.legs[0].leg.rotation.x = w * 0.5; f.legs[1].leg.rotation.x = -w * 0.5; f.legs[0].knee.rotation.x = Math.max(0, w) * 0.6; f.legs[1].knee.rotation.x = Math.max(0, -w) * 0.6; L.arm.rotation.x = -w * 0.3; f.body.position.y = Math.abs(w) * 0.08; };
  switch (f.state){
    case 'walk': {
      if (pAlive && dist > 3.2){ f.wx = nx * f.def.speed * (f.phase2 ? 1.25 : 1); f.wz = nz * f.def.speed * (f.phase2 ? 1.25 : 1); }
      walkAnim(1); A.arm.rotation.x = damp(A.arm.rotation.x, -0.3, 6, dt); A.elbow.rotation.x = damp(A.elbow.rotation.x, -0.4, 6, dt);
      faceToward(f, pp.x, pp.z, 3.5, dt);
      if (pAlive && f.t > (f.phase2 ? 0.9 : 1.5) && (dist < 7 || f.t > 3)){
        const next = ONI_PATTERN[f.pattern % ONI_PATTERN.length]; f.pattern++; f.t = 0;
        const fw = fwdVec(f.facing);
        if (next === 'slam'){ f.state = 'slamWind'; f.slamAt = new V3(f.pos.x + fw.x * 2.4, 0, f.pos.z + fw.z * 2.4); f.tele = ringTele(f.slamAt.x, f.slamAt.z, 4.8); sfx('windup'); }
        else if (next === 'charge'){ f.state = 'chargeWind'; f.chargeDir = new V3(nx, 0, nz); f.facing = Math.atan2(nx, nz); f.tele = laneTele(f.pos.x, f.pos.z, f.facing, 15, 3.0); sfx('windup'); }
        else if (next === 'volley'){ f.state = 'volley'; f.shots = f.phase2 ? 2 : 1; }
        else { f.state = 'summon'; sfx('roar'); }
      }
      break;
    }
    case 'slamWind': {
      const wd = 1.05 * q, k = f.t / wd;

        shockwave(f.slamAt.x, f.slamAt.z, 4.8, 0xffc28a, 0.55); shake(0.75, 0.4); sfx('boom');
        burst(f.slamAt.x, 0.2, f.slamAt.z, 34, { speed: 8, life: 0.8, size: 0.8, colors: [COL.dust, COL.orange], grav: 8, sys: FXP.norm });
        if (pAlive && Math.hypot(pp.x - f.slamAt.x, pp.z - f.slamAt.z) < 5.1 && pp.y < 0.6) hurtPlayer(28, f.slamAt, 11);
        if (f.phase2) for (let i = 0; i < 10; i++){ const a = i / 10 * Math.PI * 2; shootOrb(new V3(f.slamAt.x, 0.9, f.slamAt.z), new V3(f.slamAt.x + Math.cos(a) * 10, 0.9, f.slamAt.z + Math.sin(a) * 10), 6.5, 14, 0xc06bff); }
      }
      break;
    }
    case 'slamHit': A.arm.rotation.x = damp(A.arm.rotation.x, -0.7, 25, dt); f.body.rotation.x = damp(f.body.rotation.x, 0.35, 25, dt); if (f.t > 0.7 * q){ f.state = 'walk'; f.t = 0; } break;
    case 'chargeWind': {
      const wd = 0.95 * q, k = f.t / wd;

      break;
    }
    case 'charging': {
      f.direct = true; f.vel.x = f.chargeDir.x * 19; f.vel.z = f.chargeDir.z * 19;
      walkAnim(2.2); A.arm.rotation.x = 0.6;

      if (f.t > 15 / 19 || Math.hypot(f.pos.x, f.pos.z) > CONFIG.ARENA_R - 1.4){ f.state = 'dizzy'; f.t = 0; f.vel.multiplyScalar(0.2); shake(0.3, 0.2); }
      break;
    }
    case 'dizzy': f.body.rotation.x = damp(f.body.rotation.x, 0, 4, dt); f.body.rotation.z = Math.sin(f.t * 8) * 0.08;

        if (f.shots <= 0){ f.state = 'walk'; }

      break;
    }
    case 'summon': {
      A.arm.rotation.x = damp(A.arm.rotation.x, -2.6, 6, dt); L.arm.rotation.x = damp(L.arm.rotation.x, -2.6, 6, dt); f.body.rotation.x = damp(f.body.rotation.x, -0.25, 6, dt);

      break;
    }
    case 'stagger': f.state = 'walk'; break;
  }
  if (f.state !== 'slamWind' && f.state !== 'slamHit' && f.state !== 'chargeWind' && f.state !== 'charging' && f.state !== 'summon') f.body.rotation.x = damp(f.body.rotation.x, 0, 5, dt);
}

const ORB_GEO = new THREE.SphereGeometry(0.26, 14, 10);
function shootOrb(from, to, speed, dmg, color){
  const m = new THREE.Mesh(ORB_GEO, new THREE.MeshBasicMaterial({ color: 0xffffff })); m.material.userData.disposable = true;
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true })); glow.material.userData.disposable = true;
  glow.scale.setScalar(1.6); m.add(glow);
  m.position.copy(from); scene.add(m);

function updateOrbs(dt){

    const o = orbs[i], p = o.mesh.position;

      p.addScaledVector(o.vel, dt); o.life -= dt;

      if (Math.random() < 0.6){ const c = new THREE.Color(o.color); FXP.add.spawn(p.x, p.y, p.z, { life: 0.3, size: 0.35, color: [c.r, c.g, c.b], grow: -0.6 }); }

function healPlayer(n, quiet){

const PORTAL_RING = new THREE.TorusGeometry(1.0, 0.09, 8, 32);

function updatePortals(dt){
  for (let i = portals.length - 1; i >= 0; i--){
    const p = portals[i]; p.t += dt;
    const s = (p.big ? 2.2 : 1.2) * (p.done ? Math.max(0, 1 - (p.t - p.dur) / 0.4) : easeOutBack(Math.min(1, p.t / 0.35)));
    p.g.scale.setScalar(Math.max(0.01, s));
    p.g.lookAt(camera.position.x, p.g.position.y, camera.position.z);
    p.disc.rotation.z -= dt * 6;
    if (Math.random() < 0.5) FXP.add.spawn(p.x + rand(-0.8, 0.8) * s, 1.1 + rand(-0.8, 0.8) * s, p.z, { life: 0.5, size: 0.3, color: COL.purple, vy: 1 });
    if (!p.done && p.t >= p.dur){ p.done = true; makeFoe(p.kind, p.x, p.z); if (p.kind === 'oni') { sfx('roar'); shake(0.7, 0.8); } }
    if (p.done && p.t >= p.dur + 0.4){ scene.remove(p.g); p.ring.material.dispose(); p.disc.material.dispose(); p.disc.geometry.dispose(); portals.splice(i, 1); }
  }
}

function waveList(n){
  const q = [], add = (k, c) => { for (let i = 0; i < c; i++) q.push(k); };
  if (n === 10){ q.push('oni'); return q; }
  if (n === 5){ add('tenka', 3); q.push('elite'); add('lantern', 2); add('tenka', 2); return q; }
  add('tenka', 2 + n);
  if (n >= 2) add('lantern', Math.floor(n / 2));
  if (n >= 3) add('golem', n >= 8 ? 2 : 1);
  for (let i = q.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; }
  return q;
}
function aliveFoes(){ let n = 0; for (const f of foes) if (f.alive) n++; return n; }
function resetRun(){
  for (const f of foes.slice()) removeFoe(f);
  for (const o of orbs) { scene.remove(o.mesh); } orbs = [];
  for (const h of hearts) scene.remove(h.s); hearts = [];
  for (const p of portals) scene.remove(p.g); portals = [];
  for (const w of bladeWaves) scene.remove(w.g); bladeWaves = [];
  for (const v of vfx) scene.remove(v.obj); vfx.length = 0;
  for (const f of foes) if (f.tele) f.tele.remove();
  S = baseStats(); picks = {};
  Object.assign(player, { hp: CONFIG.PLAYER.hp, maxHp: CONFIG.PLAYER.hp, sp: 0, state: 'move', t: 0, vy: 0, iframes: 0, dashCd: 0, combo: -1, comboWin: 0, jumps: 0 });
  player.vel.set(0, 0, 0); player.pos.set(0, 0, 4); player.facing = Math.PI;
  game.score = 0; game.kills = 0; game.maxCombo = 0; game.combo = 0; game.boss = null; game.wave = 1; game.timeScale = 1; game.slowT = 0;
  $('bossbar').hidden = true; updateCombo();
  hero.body.rotation.set(0, 0, 0); hero.body.position.set(0, 0, 0);
  setFlash(hero.mats, false); setFace('open', 0);
  cam.yaw = 0; cam.pitch = CONFIG.CAM.pitch;
}
function startRun(snap){
  resetRun();
  if (snap){
    game.wave = snap.wave || 1; game.score = snap.score || 0; game.kills = snap.kills || 0; game.maxCombo = snap.maxCombo || 0;
    if (snap.S) S = Object.assign(baseStats(), snap.S); if (snap.picks) picks = snap.picks;
    player.maxHp = snap.maxHp || CONFIG.PLAYER.hp; player.hp = Math.max(1, snap.hp || player.maxHp);
  }
  game.startTime = performance.now();
  closePanel(); $('hud').hidden = false;
  startWave();
}
function startWave(){
  game.state = 'intro'; game.t = 0;
  game.spawnQueue = waveList(game.wave); game.spawnT = 0.3;
  banner(game.wave === CONFIG.WAVES ? 'ФИНАЛ' : `ВОЛНА ${game.wave}`, WAVE_SUBS[game.wave - 1]);
  if (game.wave === CONFIG.WAVES) setTimeout(() => sfx('roar'), 900);
}
function waveCleared(){
  game.state = 'clear'; game.t = 0;
  const bonus = 300 * game.wave; addScore(bonus);
  slowmo(0.4, 0.8); sfx('clear');
  healPlayer(15);
  banner(game.wave === CONFIG.WAVES ? 'НЕБО ОЧИЩЕНО' : 'ВОЛНА ОЧИЩЕНА', `+${bonus} очков`);
  setFace('happy', 2.2);
}
function updateWaves(dt){
  game.t += dt;
  if (game.state === 'intro' && game.t > 1.7){ game.state = 'play'; game.t = 0; }
  if (game.state === 'play'){
    game.spawnT -= dt;
    const cap = game.boss ? 6 : CONFIG.MAX_ALIVE;
    if (game.spawnQueue.length && game.spawnT <= 0 && aliveFoes() + portals.length < cap){
      openPortal(game.spawnQueue.shift()); game.spawnT = rand(0.5, 1.2);
    }
    if (!game.spawnQueue.length && !aliveFoes() && !portals.length) waveCleared();
  }
  if (game.state === 'clear' && game.t > 2.0){
    for (const h of hearts) h.life = Math.min(h.life, 0.01);
    if (game.wave >= CONFIG.WAVES) victory(); else showBlessings();
  }
  if (game.state === 'dead' && game.t > 2.1) showOver(false);
}
function victory(){ game.state = 'win'; game.t = 0; setFace('happy', 999); showOver(true); }

// ============================== ЭФФЕКТЫ ВРЕМЕНИ, КАМЕРА ==============================
function hitStop(s){ game.hitStop = Math.max(game.hitStop, s); }
function slowmo(scale, dur){ game.timeScale = scale; game.slowT = dur; }
function shake(mag, dur){ if (!settings.shake) mag *= 0.25; game.shakeMag = Math.max(game.shakeMag, mag); game.shakeT = Math.max(game.shakeT, dur); }
function addScore(n){ game.score += n; }
function updateCamera(dt, now){
  const portrait = camera.aspect < 0.85;
  if (game.state === 'title' || game.state === 'win' || game.state === 'over' && player.state !== 'dead'){
    const a = 0.35 + Math.sin(now * 0.00018) * 0.55, r = portrait ? 5.6 : 4.6;
    camera.position.set(player.pos.x + Math.sin(a) * r, 1.65 + Math.sin(now * 0.0003) * 0.2, player.pos.z + Math.cos(a) * r);
    camera.fov = portrait ? 58 : 44; camera.updateProjectionMatrix();
    camera.lookAt(player.pos.x, portrait ? 1.05 : 1.15, player.pos.z);
    syncPointScale();
    return;
  }
  const dist = (portrait ? CONFIG.CAM.distPortrait : CONFIG.CAM.dist) + (game.boss ? 1.6 : 0);
  const mv = getMoveInput();
  if (mv.lengthSq() > 0.25 && now / 1000 - cam.lastManual > 1.6 && player.state === 'move'){
    const want = Math.atan2(-mv.x, -mv.z), d = angleDiff(cam.yaw, want);
    if (Math.abs(d) < 2.2) cam.yaw += d * (1 - Math.exp(-0.9 * dt));
  }
  cam.target.x = damp(cam.target.x, player.pos.x, 10, dt); cam.target.z = damp(cam.target.z, player.pos.z, 10, dt);
  cam.target.y = damp(cam.target.y, player.pos.y * 0.5 + 1.15, 6, dt);
  const cp = Math.cos(cam.pitch), spn = Math.sin(cam.pitch);
  let x = cam.target.x + Math.sin(cam.yaw) * cp * dist, y = cam.target.y + spn * dist, z = cam.target.z + Math.cos(cam.yaw) * cp * dist;
  if (game.shakeT > 0){ const m = game.shakeMag * Math.min(1, game.shakeT * 5); x += rand(-m, m); y += rand(-m, m) * 0.6; z += rand(-m, m); }
  camera.position.set(x, Math.max(0.5, y), z);
  camera.lookAt(cam.target.x, cam.target.y, cam.target.z);
  syncPointScale();
  const fov = (portrait ? CONFIG.CAM.fovPortrait : CONFIG.CAM.fov) + game.fovKick;
  if (Math.abs(camera.fov - fov) > 0.01){ camera.fov = damp(camera.fov, fov, 8, dt); camera.updateProjectionMatrix(); }
  game.fovKick = damp(game.fovKick, 0, 4, dt);
}

// ============================== 2D-СЛОЙ: цифры, линии скорости, вспышки ==============================
const fxCv = $('fx'), fx = fxCv.getContext('2d');
let fxW = 1, fxH = 1, fxDpr = 1;
function addNumber(pos, text, kind){ numbers.push({ pos: pos.clone(), text: String(text), kind, t: 0, life: kind === 'crit' ? 0.95 : 0.8, dx: rand(-14, 14) }); if (numbers.length > 40) numbers.shift(); }
const _proj = new V3();
function drawFx(dt){
  fx.setTransform(fxDpr, 0, 0, fxDpr, 0, 0);
  fx.clearRect(0, 0, fxW, fxH);
  // линии скорости
  const sl = (player.state === 'dash' ? 1 : 0) + (player.state === 'special' ? 1 : 0) + (game.speedLines > 0 ? 0.5 : 0);
  game.speedLines = Math.max(0, (game.speedLines || 0) - dt);
  if (sl > 0){
    fx.save(); fx.translate(fxW / 2, fxH / 2); fx.strokeStyle = 'rgba(255,255,255,.55)'; fx.lineCap = 'round';
    const R = Math.hypot(fxW, fxH) / 2;
    for (let i = 0; i < 46; i++){
      const a = Math.random() * Math.PI * 2, r0 = R * rand(0.55, 0.85);
      fx.lineWidth = rand(1, 3.5); fx.beginPath(); fx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); fx.lineTo(Math.cos(a) * R * 1.1, Math.sin(a) * R * 1.1); fx.stroke();
    }
    fx.restore();
  }
  // цифры урона
  fx.textAlign = 'center'; fx.textBaseline = 'middle'; fx.lineJoin = 'round';
  for (let i = numbers.length - 1; i >= 0; i--){
    const n = numbers[i]; n.t += dt;
    if (n.t >= n.life){ numbers.splice(i, 1); continue; }
    _proj.copy(n.pos); _proj.y += easeOut(n.t / n.life) * 0.9; _proj.project(camera);
    if (_proj.z > 1) continue;
    const x = (_proj.x + 1) / 2 * fxW + n.dx * (n.t / n.life), y = (1 - _proj.y) / 2 * fxH;
    const pop = n.t < 0.12 ? 1 + (1 - n.t / 0.12) * 0.6 : 1;
    const base = n.kind === 'crit' ? 34 : n.kind === 'hurt' ? 28 : n.kind === 'cut' ? 18 : 24;
    fx.globalAlpha = n.t > n.life * 0.7 ? 1 - (n.t - n.life * 0.7) / (n.life * 0.3) : 1;
    fx.font = `italic 900 ${Math.round(base * pop)}px Nunito, system-ui, sans-serif`;
    fx.lineWidth = 6; fx.strokeStyle = '#1d1430'; fx.strokeText(n.text, x, y);
    fx.fillStyle = n.kind === 'crit' ? '#ffd36b' : n.kind === 'hurt' ? '#ff5c7a' : n.kind === 'heal' ? '#7dffb0' : n.kind === 'cut' ? '#9fe8ff' : '#ffffff';
    fx.fillText(n.text, x, y);
  }
  fx.globalAlpha = 1;
  // полоски здоровья над ранеными врагами
  for (const f of foes){
    if (!f.alive || f.def.boss || f.hp >= f.maxHp || f.spawnT > 0) continue;
    const h = f.kind === 'lantern' ? 2.1 : f.kind === 'golem' ? 3.0 : 1.35;
    _proj.set(f.pos.x, f.pos.y + h, f.pos.z).project(camera); if (_proj.z > 1) continue;
    const x = (_proj.x + 1) / 2 * fxW, y = (1 - _proj.y) / 2 * fxH, w = f.kind === 'golem' ? 64 : 44;
    fx.fillStyle = '#1d1430'; fx.fillRect(x - w / 2 - 2, y - 4, w + 4, 8);
    fx.fillStyle = '#ff5c8a'; fx.fillRect(x - w / 2, y - 2, w * Math.max(0, f.hp / f.maxHp), 4);
  }
  // вспышка экрана и виньетка при низком здоровье
  if (game.flash > 0){ fx.fillStyle = `rgba(${game.flashColor},${Math.min(0.55, game.flash)})`; fx.fillRect(0, 0, fxW, fxH); game.flash = Math.max(0, game.flash - dt * 2.2); }
  if (player.hp / player.maxHp < 0.3 && player.state !== 'dead' && game.state !== 'title'){
    const g = fx.createRadialGradient(fxW / 2, fxH / 2, Math.min(fxW, fxH) * 0.35, fxW / 2, fxH / 2, Math.max(fxW, fxH) * 0.75);
    g.addColorStop(0, 'rgba(255,40,80,0)'); g.addColorStop(1, `rgba(255,40,80,${0.28 + Math.sin(performance.now() * 0.008) * 0.1})`);
    fx.fillStyle = g; fx.fillRect(0, 0, fxW, fxH);
  }
}

  game.state = 'upgrade';
  const pool = BLESSINGS.filter(b => (picks[b.id] || 0) < b.max);
  for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  blessingChoices = pool.slice(0, 3);
  panel(`
    <p class="eyebrow">Волна ${game.wave} позади</p>
    <h2>Выбери благословение</h2>
    <div class="cards">
      ${blessingChoices.map((b, i) => `<button class="card" data-act="bless" data-i="${i}">${ICONS[b.icon]}<div><b>${b.name}</b><span>${b.desc}</span><i>${'●'.repeat(picks[b.id] || 0)}${'○'.repeat(b.max - (picks[b.id] || 0))}</i></div></button>`).join('')}
    </div>`);
}
function clearField(){
  for (const f of foes.slice()) removeFoe(f);
  for (const o of orbs) scene.remove(o.mesh); orbs = [];
  for (const p of portals) scene.remove(p.g); portals = [];
  for (const w of bladeWaves) scene.remove(w.g); bladeWaves = [];
  for (const h of hearts) scene.remove(h.s); hearts = [];
  game.boss = null; $('bossbar').hidden = true;
}
function showOver(win){
  game.state = win ? 'win' : 'over';
  clearField();
  const best = Save.get(BEST_KEY, { wave: 0, score: 0, wins: 0 });
  const rec = game.score > best.score;
  Save.set(BEST_KEY, { wave: Math.max(best.wave, game.wave), score: Math.max(best.score, game.score), wins: best.wins + (win ? 1 : 0) });
  const mins = Math.max(1, Math.round((performance.now() - game.startTime) / 60000));
  $('hud').hidden = true;
  if (!win){ player.state = 'move'; player.hp = player.maxHp; hero.body.rotation.set(0, 0, 0); hero.body.position.set(0, 0, 0); setFace('blink', 999); }
  panel(`
    <p class="eyebrow">${win ? 'Рассвет над храмом' : 'Закат победил'}</p>
    <h2>${win ? 'Небо очищено!' : 'Свет угас'}</h2>
    <p>${win ? 'Великий Они повержен, тени отступили. Мио встречает рассвет.' : `Мио пала на волне ${game.wave}. Тени ещё вернутся — и она тоже.`}</p>
    <dl class="sheet">
      <dt>Волна</dt><dd>${game.wave} из ${CONFIG.WAVES}</dd>
      <dt>Повержено врагов</dt><dd>${game.kills}</dd>
      <dt>Лучшее комбо</dt><dd>${game.maxCombo}</dd>
      <dt>Время</dt><dd>${mins} мин</dd>
      <dt>Очки</dt><dd class="total">${game.score.toLocaleString('ru-RU')}</dd>
    </dl>
    ${rec ? '<p class="newrec">Новый рекорд!</p>' : ''}
    <button class="btn primary" data-act="start">${win ? 'Ещё раз' : 'Снова в бой'}</button>
    <button class="btn ghost" data-act="menu">В меню</button>`);
}
$panel.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  Snd.init(); sfx('ui');
  switch (b.dataset.act){
    case 'start': startRun(); break;
    case 'help': showHelp('title'); break;
    case 'helpPause': showHelp('pause'); break;
    case 'settings': showSettings('title'); break;
    case 'back': if (panelBack === 'pause') showSettings('pause'); else showTitle(); break;
    case 'resume': resume(); break;
    case 'quit': case 'menu': showTitle(); break;
    case 'toggle': {
      const k = b.dataset.key; settings[k] = !settings[k]; saveSettings();
      const on = k === 'eco' ? !settings[k] : settings[k];
      b.setAttribute('aria-pressed', on); b.querySelector('i').textContent = on ? 'ВКЛ' : 'ВЫКЛ';
      if (k === 'music') Music.setOn(settings.music);
      if (k === 'eco') resize();
      break;
    }
    case 'bless': {
      const bl = blessingChoices[+b.dataset.i]; if (!bl) return;
      bl.apply(S, player); picks[bl.id] = (picks[bl.id] || 0) + 1;
      sfx('pick'); closePanel(); game.wave++; startWave();
      break;
    }
  }
});

// ============================== ВВОД ==============================
const touchEl = $('touch'), stickEl = $('stick'), knobEl = $('knob');
touchEl.addEventListener('pointerdown', ev => {
  Snd.init();
  if (!canControl() && game.state !== 'pause') return;
  ev.preventDefault();
  const w = window.innerWidth;
  if (ev.pointerType === 'mouse'){
    input.cam.id = ev.pointerId; input.cam.lx = ev.clientX; input.cam.ly = ev.clientY; input.cam.moved = 0; input.cam.mouse = true;
  } else if (ev.clientX < w * 0.45 && input.stick.id === null){
    input.stick.id = ev.pointerId; input.stick.ox = ev.clientX; input.stick.oy = ev.clientY; input.stick.x = input.stick.y = 0;
    stickEl.hidden = false; stickEl.style.left = ev.clientX + 'px'; stickEl.style.top = ev.clientY + 'px'; knobEl.style.transform = '';
    $('stickHint').hidden = true;
  } else if (input.cam.id === null){
    input.cam.id = ev.pointerId; input.cam.lx = ev.clientX; input.cam.ly = ev.clientY; input.cam.moved = 0; input.cam.mouse = false;
  }
  try { touchEl.setPointerCapture(ev.pointerId); } catch {}
});
touchEl.addEventListener('pointermove', ev => {
  if (ev.pointerId === input.stick.id){
    const R = 56; let dx = ev.clientX - input.stick.ox, dy = ev.clientY - input.stick.oy; const d = Math.hypot(dx, dy);
    if (d > R){ dx *= R / d; dy *= R / d; }
    knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
    const m = Math.min(1, d / R), dz = 0.12, mag = m < dz ? 0 : (m - dz) / (1 - dz);
    input.stick.x = d ? dx / Math.min(d, R) * mag : 0; input.stick.y = d ? -dy / Math.min(d, R) * mag : 0;
  } else if (ev.pointerId === input.cam.id){
    const dx = ev.clientX - input.cam.lx, dy = ev.clientY - input.cam.ly;
    input.cam.lx = ev.clientX; input.cam.ly = ev.clientY; input.cam.moved += Math.abs(dx) + Math.abs(dy);
    cam.yaw -= dx * 0.0085; cam.pitch = clamp(cam.pitch + dy * 0.005, 0.08, 0.95);
    cam.lastManual = performance.now() / 1000;
  }
});
function releasePointer(ev){
  if (ev.pointerId === input.stick.id){ input.stick.id = null; input.stick.x = input.stick.y = 0; stickEl.hidden = true; }
  else if (ev.pointerId === input.cam.id){ if (input.cam.mouse && input.cam.moved < 6 && ev.type === 'pointerup') pressAttack(); input.cam.id = null; }
}
touchEl.addEventListener('pointerup', releasePointer);
touchEl.addEventListener('pointercancel', releasePointer);
const bindBtn = (id, down, up) => {
  const el = $(id);
  el.addEventListener('pointerdown', ev => { ev.preventDefault(); ev.stopPropagation(); Snd.init(); el.classList.add('on'); try { el.setPointerCapture(ev.pointerId); } catch {} down(); });
  const off = () => { el.classList.remove('on'); if (up) up(); };
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
};
bindBtn('bAttack', () => { input.attackHeld = true; pressAttack(); }, () => { input.attackHeld = false; });
bindBtn('bDash', pressDash);
bindBtn('bJump', pressJump);
bindBtn('bSpecial', pressSpecial);
$('pauseBtn').addEventListener('click', () => { Snd.init(); sfx('ui'); showPause(); });
document.addEventListener('keydown', ev => {
  Snd.init();
  if (ev.repeat && !['KeyJ', 'Enter'].includes(ev.code)) { if (ev.code.startsWith('Arrow') || ev.code === 'Space') ev.preventDefault(); input.keys.add(ev.code); return; }
  input.keys.add(ev.code);
  if (ev.code === 'Escape' || ev.code === 'KeyP'){ if (game.state === 'pause') resume(); else showPause(); return; }
  if (!canControl()) return;
  if (ev.code === 'Space'){ ev.preventDefault(); pressJump(); }
  else if (ev.code === 'ShiftLeft' || ev.code === 'ShiftRight' || ev.code === 'KeyK') pressDash();
  else if (ev.code === 'KeyJ' || ev.code === 'Enter'){ input.attackHeld = true; pressAttack(); }
  else if (ev.code === 'KeyE' || ev.code === 'KeyL') pressSpecial();
  else if (ev.code.startsWith('Arrow')) ev.preventDefault();
});
document.addEventListener('keyup', ev => { input.keys.delete(ev.code); if (ev.code === 'KeyJ' || ev.code === 'Enter') input.attackHeld = false; });
window.addEventListener('blur', () => { input.keys.clear(); input.attackHeld = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ showPause(); if (Snd.ctx) Snd.ctx.suspend().catch(() => {}); }
  else if (Snd.ctx) Snd.ctx.resume().catch(() => {});
});

// ============================== ЦИКЛ ==============================
function syncPointScale(){
  if (!FXP) return;
  const sc = fxH * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * Math.PI / 360));
  FXP.add.mat.uniforms.scale.value = sc; FXP.norm.mat.uniforms.scale.value = sc; FXP.petals.mat.uniforms.scale.value = sc;
}
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = settings.eco ? 1 : Math.min(window.devicePixelRatio || 1, autoDpr);
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  fxDpr = Math.min(window.devicePixelRatio || 1, 2); fxW = w; fxH = h; fxCv.width = Math.round(w * fxDpr); fxCv.height = Math.round(h * fxDpr);
  syncPointScale();
}
let autoDpr = 2, slowFrames = 0;
let last = performance.now(), fpsAvg = 60;
function ambientUpdate(dt, now){
  if (ambient.sky) ambient.sky.position.copy(camera.position);
  if (ambient.clouds) ambient.clouds.rotation.y += dt * 0.004;
  ambient.lanterns.forEach((l, i) => { l.material.opacity = 0.6 + Math.sin(now * 0.008 + i * 1.7) * 0.08 + Math.random() * 0.05; });
  for (const r of ambient.rocks) r.g.position.y = r.y + Math.sin(now * 0.0006 + r.ph) * 0.6;
  // падающие лепестки
  if (Math.random() < (settings.eco ? 0.3 : 0.5)){
    const a = rand(0, Math.PI * 2), r = rand(0, 24);
    FXP.petals.spawn(Math.cos(a) * r + player.pos.x * 0.5, rand(7, 13), Math.sin(a) * r + player.pos.z * 0.5,
      { vx: rand(0.4, 1.4), vy: rand(-1.3, -0.7), vz: rand(-0.4, 0.4), life: rand(7, 11), size: rand(0.16, 0.28), grav: 0, drag: 0, sway: 0.8, color: COL.white });
  }
  if (Math.random() < 0.15){ const a = rand(0, Math.PI * 2), r = rand(3, 16); FXP.add.spawn(Math.cos(a) * r, rand(0.3, 2.5), Math.sin(a) * r, { life: rand(2, 3.5), size: rand(0.12, 0.2), color: COL.gold, vy: rand(0.1, 0.4), sway: 0.4, drag: 0 }); }
}
function frame(now){
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  fpsAvg = fpsAvg * 0.95 + (1 / Math.max(dt, 0.001)) * 0.05;
  if (!settings.eco && game.state === 'play'){
    if (fpsAvg < 38){ if (++slowFrames > 120 && autoDpr > 1){ autoDpr = Math.max(1, autoDpr - 0.5); slowFrames = 0; resize(); } } else slowFrames = 0;
  }
  let sim = dt;
  if (game.hitStop > 0){ game.hitStop -= dt; sim = 0; }
  if (game.slowT > 0){ game.slowT -= dt; sim *= game.timeScale; if (game.slowT <= 0) game.timeScale = 1; }
  if (game.shakeT > 0){ game.shakeT -= dt; if (game.shakeT <= 0) game.shakeMag = 0; }
  const active = ['intro', 'play', 'clear', 'dead'].includes(game.state);
  if (active){
    if (input.attackHeld && player.state === 'move') pressAttack();
    else if (input.attackHeld && player.state === 'attack') pressAttack();
    if (game.comboT > 0){ game.comboT -= sim; if (game.comboT <= 0){ game.combo = 0; updateCombo(); } }
    updatePlayer(sim);
    updateFoes(sim, now);
    updateOrbs(sim); updateHearts(sim); updatePortals(sim); updateBladeWaves(sim);
    updateWaves(sim);
    updateHUD();
  } else if (game.state === 'title' || game.state === 'win' || game.state === 'over'){
    player.vel.set(0, 0, 0); player.pos.y = 0;
    const ang = game.state === 'title' ? Math.sin(now * 0.0004) * 0.25 : 0;
    player.facing = damp(player.facing, ang, 3, dt);
  }
  if (game.state !== 'pause' && game.state !== 'upgrade'){
    animateHero(game.state === 'title' || game.state === 'win' || game.state === 'over' ? dt : sim, now / 1000);
    updateVfx(sim);
    FXP.add.update(sim); FXP.norm.update(sim); FXP.petals.update(game.state === 'title' ? dt : Math.max(sim, dt * 0.3));
    ambientUpdate(dt, now);
  }
  updateCamera(dt, now);
  renderer.render(scene, camera);
  drawFx(game.state === 'pause' ? 0 : dt);
}

// ============================== СТАРТ ==============================
window.claude?.hot?.snapshot?.(() => (['intro', 'play', 'clear', 'upgrade', 'pause'].includes(game.state)
  ? { run: { wave: game.wave, score: game.score, kills: game.kills, maxCombo: game.maxCombo, hp: player.hp, maxHp: player.maxHp, S, picks } } : {}));
function start(data){
  buildTextures();
  buildWorld();
  FXP = { add: new PSystem(700, TEX.spark, true), norm: new PSystem(400, TEX.glow, false), petals: new PSystem(600, TEX.petal, false) };
  hero = buildHeroine();
  player.pos = hero.root.position;
  drawPortrait('open');
  resize();
  window.addEventListener('resize', resize);
  if (data && data.run) startRun(data.run); else showTitle();
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
